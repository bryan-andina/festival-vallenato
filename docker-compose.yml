services:
  db:
    image: mysql:8.4
    container_name: vallenato_mysql
    restart: always
    environment:
      MYSQL_DATABASE: vallenato_festival_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - vallenato_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vallenato_mysql_data:
