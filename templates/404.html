<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Festival Vallenato</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #2d3748;
        }

        .error-box {
            width: min(90%, 620px);
            padding: 40px 28px;
            text-align: center;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .code {
            margin: 0;
            font-size: 4rem;
            font-weight: 700;
            color: #1b4d3e;
        }

        h1 {
            margin: 10px 0 12px;
        }

        p {
            line-height: 1.6;
            color: #667085;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 18px;
            border-radius: 8px;
            color: #ffffff;
            background: #1b4d3e;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="error-box">
        <p class="code">404</p>
        <h1>Página no encontrada</h1>
        <p>La página que intentas consultar no existe o ya no está disponible.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
